[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-group-ai-lab"
version = "0.1.0"
description = "Experimental Windows WeChat 4.x group AI assistant"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
    "zstandard>=0.19.0",
    "wechatauto-replica @ git+https://github.com/fanyuantaier/wechatauto-replica.git@d322c4a9b1124228820bab363e5676016f188fc6",
]

[project.scripts]
wechat-group-ai = "wechat_group_ai.bot:main"

[tool.setuptools.packages.find]
where = ["src"]
